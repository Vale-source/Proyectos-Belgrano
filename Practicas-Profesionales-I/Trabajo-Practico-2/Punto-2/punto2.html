<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripcion a Torneos de Videojuegos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">
    <h2 class="text-center mb-4 text-primary fw-bold">Inscripcion a Torneos</h2>
<form action="https://formspree.io/f/sample" method="post" class="col-11 col-sm-9 col-md-7 col-lg-5 mx-auto">
    <fieldset class="border rounded-3 p-4 mb-4 bg-white shadow-sm">
        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Datos Personales</legend>
        <p class="mb-3">
        <Label for="nombre" class="form-label fw-semibold text-secondary">Nombres</Label><br>
        <input type="text" id="nombre" name="nombre-personal" class="form-control" placeholder="Nombre/es" required>
        </p>
        
        <p class="mb-3">
        <Label for="apellidos" class="form-label fw-semibold text-secondary">Apellidos</Label><br>
        <input type="text" id="apellidos" name="apellido-personal" class="form-control" placeholder="Apellido/es" required>
        </p>

        <p class="mb-3">
        <Label for="telefono" class="form-label fw-semibold text-secondary">Telefono</Label><br>
        <input type="tel" id="telefono" name="telefono-personal" class="form-control" placeholder="+54 261 123 4567" required pattern="[0-9+\s-]{8,20}">
        </p>
        
        <p class="mb-3">
        <Label for="correo" class="form-label fw-semibold text-secondary">Correo Electronico</Label><br>
        <input type="email" id="correo" name="correo-personal" class="form-control" placeholder="nombre@gmail.com" required>
        </p>
    </fieldset>
    
    <fieldset class="border rounded-3 p-4 mb-4 bg-white shadow-sm">
    <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Datos de Jugador</legend>
        
        <p class="mb-3">
        <Label for="nickname" class="form-label fw-semibold text-secondary">Nickname/Gamertag</Label><br>
        <input type="text" id="nickname" name="nickname-jugador" class="form-control" placeholder="Nick" required>
        </p>

        <p class="mb-3">
        <Label for="steam-cuenta" class="form-label fw-semibold text-secondary">Link de Cuenta de Steam</Label><br>
        <input type="url" id="steam-cuenta" name="steam-jugador" class="form-control" placeholder="https://steamcommunity.com/profiles/1234567890123456/" required>
        </p>

        <p class="mb-3">
        <Label for="discord-tag" class="form-label fw-semibold text-secondary">Usuario de Discord</Label><br>
        <input type="text" id="discord-tag" name="discord-jugador" class="form-control" placeholder="nombre1234" required>
        </p>

        <p class="mb-3">
        <Label for="torneo" class="form-label fw-semibold text-secondary">Seleccione el torneo al que participara </Label><br>
        <select id="torneo" name="torneos" class="form-select" required>
            <option value="" selected disabled>---Elige---</option>
            <option value="counter-strike">Counter-Strike</option>
            <option value="mortal-kombat">Mortal Kombat 1</option>
            <option value="fortnite">Fortnite</option>
            <option value="dragon-ball">Dragon Ball Sparking Zero</option>    
        </select>
        </p>
        
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">Enviar Inscripcion</button>
    
    </fieldset>

</form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
