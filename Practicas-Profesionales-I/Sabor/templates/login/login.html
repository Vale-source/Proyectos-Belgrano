<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión · Sabor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body class="auth-page">
    <a class="dashboard-brand auth-brand" href="/">Sabor<span>.</span></a>

    <div class="auth-card">
        <p class="eyebrow">Acceso administrativo</p>
        <h1>Iniciar Sesión</h1>
        <p class="intro">Ingresá tus credenciales para acceder al panel de control.</p>

        {% if error %}
        <div class="auth-error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}" class="access-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-field">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="form-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="button button-primary auth-submit-btn">Entrar al panel</button>
        </form>
    </div>
</body>

</html>
