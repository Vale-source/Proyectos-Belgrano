<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Administrador · Sabor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>

<body class="auth-page">
    <a class="dashboard-brand auth-brand" href="/">Sabor<span>.</span></a>

    <div class="auth-card">
        <p class="eyebrow">Gestión de administradores</p>
        <h1>Nuevo Administrador</h1>
        <p class="intro">Creá un nuevo usuario con permisos de administración.</p>

        {% if error %}
        <div class="auth-error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.signup') }}" class="access-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-field">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>

            <div class="form-field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>

            <button type="submit" class="button button-primary auth-submit-btn">Crear Administrador</button>
        </form>

        <a class="auth-link" href="{{ url_for('sucursales.index') }}">← Volver al panel</a>
    </div>
</body>

</html>
